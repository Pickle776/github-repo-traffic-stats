name: Query GitHub Traffic Data

on:
  schedule:
    # Runs at 23:30 UTC every day
    - cron: '30 23 * * *'
  workflow_dispatch:

jobs:
  query-traffic-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Query Traffic Data
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python query_github_traffic_data.py

      - name: Generate Preview Plots
        run: python create_preview_plots.py

      - name: Commit and Push
        run: |
          git config --local user.email "noreply@github.com"
          git config --local user.name "github-actions[bot]"
          git add data/* preview_plots/*
          git diff --staged --quiet || (git commit -m "chore: daily traffic and plot update" && git push)
