<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pickle776 GitHub Traffic Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.0/papaparse.min.js"></script>
    <style>
        html {
            font-size: 14px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f6f8fa;
            text-align: center;
            color: #24292f;
        }
        .charts-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .chart-container {
            flex: 1 1 calc(50% - 20px);
            min-width: 320px;
            max-width: 700px;
            background-color: white;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(31,35,40,0.06);
            padding: 20px;
            box-sizing: border-box;
        }
        h1, h2 {
            color: #24292f;
        }
        select {
            margin: 10px 5px;
        }
        .preview-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 24px;
            max-width: 1500px;
            margin: 0 auto;
        }
        .preview-item {
            flex: 1 1 650px;
            max-width: 700px;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            background: white;
            border: 1px solid #d0d7de;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(31,35,40,0.08);
            overflow: hidden;
            padding: 12px;
            box-sizing: border-box;
        }
        .preview-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(31,35,40,0.15);
            border-color: #0969da;
        }
        .preview-item img {
            width: 100%;
            height: auto;
            border-radius: 6px;
            display: block;
        }
        .preview-item .click-hint {
            margin-top: 8px;
            font-size: 13px;
            color: #0969da;
            font-weight: 500;
        }
        #dashboardView {
            display: none;
        }
        .dashboard-header {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding: 10px 20px 20px;
            position: relative;
            max-width: 1500px;
            margin: 0 auto;
        }
        #backButton {
            padding: 8px 16px;
            background-color: white;
            border: 1px solid #d0d7de;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #24292f;
            margin-bottom: 12px;
            transition: background 0.15s;
        }
        #backButton:hover {
            background-color: #f3f4f6;
            border-color: #0969da;
            color: #0969da;
        }
        .repo-title {
            margin: 0 20px 0 0;
            word-break: break-word;
            font-size: 24px;
        }
        .repo-title a {
            color: #0969da;
            text-decoration: none;
        }
        .repo-title a:hover {
            text-decoration: underline;
        }
        #timeRange {
            font-size: 15px;
            padding: 6px 12px;
            border-radius: 6px;
            border: 1px solid #d0d7de;
            background: white;
            cursor: pointer;
        }

        @media (min-width: 768px) {
            .dashboard-header {
                flex-direction: row;
                align-items: center;
            }
            #backButton {
                margin-bottom: 0;
                margin-right: 20px;
            }
        }
    </style>
</head>
<body>
    <h1 id="mainHeader"><a id="ownerLink" href="https://github.com/Pickle776" target="_blank">github.com/Pickle776</a> traffic dashboard</h1>
    
    <div id="previewView">
        <div class="preview-grid" id="previewGrid"></div>
    </div>

    <div id="dashboardView">
        <div class="dashboard-header">
            <button id="backButton" onclick="showPreview()">← Back</button>
            <h1 class="repo-title">GitHub Traffic Dashboard - <a id="repoLink" href="#" target="_blank"></a></h1>
            <select id="timeRange" onchange="updateCharts()">
                <option value="total">Total</option>
                <option value="7">Last 7 days</option>
                <option value="30">Last 30 days</option>
                <option value="365">Last 365 days</option>
            </select>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <h2>GitHub Views</h2>
                <canvas id="viewsChart"></canvas>
            </div>

            <div class="chart-container">
                <h2>GitHub Clones</h2>
                <canvas id="clonesChart"></canvas>
            </div>

            <div class="chart-container">
                <h2>Approximate Top GitHub Referrers</h2>
                <canvas id="referrersChart"></canvas>
            </div>

            <div class="chart-container">
                <h2>Approximate Top GitHub Paths</h2>
                <canvas id="pathsChart"></canvas>
            </div>
        </div>
    </div>

    <p style="margin-top: 40px; color: #57609a; font-size: 13px;">
        Tracking repositories for <a href="https://github.com/Pickle776" target="_blank" style="color: #0969da;">Pickle776</a> automatically via GitHub Actions
    </p>

    <script>
    const OWNER = 'Pickle776';
    const REPOSITORIES = [
        "BookTracker",
        "JWall",
        "Kinetic",
        "Live-Earth",
        "SANParks-tracker",
        "github-repo-traffic-stats"
    ];

    const PIE_CHART_COLORS = [
        'rgba(255, 99, 132, 0.7)',
        'rgba(54, 162, 235, 0.7)',
        'rgba(255, 206, 86, 0.7)',
        'rgba(75, 192, 192, 0.7)',
        'rgba(153, 102, 255, 0.7)',
        'rgba(255, 159, 64, 0.7)',
        'rgba(199, 199, 199, 0.7)',
        'rgba(83, 102, 255, 0.7)',  
        'rgba(255, 99, 255, 0.7)',
        'rgba(127, 127, 127, 0.7)'
    ];

    async function fetchCSV(url) {
        try {
            const response = await fetch(url);
            if (!response.ok) return [];
            const text = await response.text();
            return Papa.parse(text, { header: true, dynamicTyping: true, skipEmptyLines: true }).data;
        } catch (e) {
            return [];
        }
    }

    function createChart(elementId, type, data, options) {
        return new Chart(document.getElementById(elementId), {
            type: type,
            data: data,
            options: options
        });
    }

    let clonesChart, pathsChart, referrersChart, viewsChart;
    let allClonesData = [], allPathsData = [], allReferrersData = [], allViewsData = [];
    let currentDataSource = REPOSITORIES[0];
    let previewScrollPosition = 0;

    function addMissingDates(data, dateField) {
        if (!data || data.length === 0) return [];
        const startDate = new Date(data[0][dateField]);
        const endDate = new Date();
        const dateRange = getDateRange(startDate, endDate);
        
        const dataLookup = {};
        data.forEach(entry => {
            if (entry && entry[dateField]) dataLookup[entry[dateField]] = entry;
        });
        
        return dateRange.map(date => {
            return dataLookup[date] || {
                [dateField]: date,
                count: 0,
                uniques: 0
            };
        });
    }

    function getDateRange(startDate, endDate) {
        const dateList = [];
        for (let d = new Date(startDate); d <= endDate; d.setDate(d.getDate() + 1)) {
            dateList.push(d.toISOString().split('T')[0]);
        }
        return dateList;
    }

    function filterLastNEntries(data, n) {
        return n === 'total' ? data : data.slice(-n);
    }

    async function loadDataAndCreateCharts() {
        allClonesData = addMissingDates(await fetchCSV(`data/github_clones/${currentDataSource}.csv`), 'date');
        allPathsData = addMissingDates(await fetchCSV(`data/github_paths/${currentDataSource}.csv`), 'date');
        allReferrersData = addMissingDates(await fetchCSV(`data/github_referrers/${currentDataSource}.csv`), 'date');
        allViewsData = addMissingDates(await fetchCSV(`data/github_views/${currentDataSource}.csv`), 'date');

        updateCharts();
    }

    function updateCharts() {
        const timeRange = document.getElementById('timeRange').value;
        const days = timeRange === 'total' ? 'total' : parseInt(timeRange);

        const clonesData = filterLastNEntries(allClonesData, days);
        const pathsData = filterLastNEntries(allPathsData, days);
        const referrersData = filterLastNEntries(allReferrersData, days);
        const viewsData = filterLastNEntries(allViewsData, days);

        updateClonesChart(clonesData);
        updatePathsChart(pathsData);
        updateReferrersChart(referrersData);
        updateViewsChart(viewsData);
    }

    function updateClonesChart(clonesData) {
        if (clonesChart) clonesChart.destroy();
        const totalClones = clonesData.reduce((sum, row) => sum + (row.count || 0), 0);
        const totalUniqueClones = clonesData.reduce((sum, row) => sum + (row.uniques || 0), 0);

        const container = document.getElementById('clonesChart').closest('.chart-container');
        container.querySelector('h2').innerHTML = `GitHub Clones (Total: ${totalClones}, Unique: ${totalUniqueClones})`;

        clonesChart = createChart('clonesChart', 'line', {
            labels: clonesData.map(row => row.date),
            datasets: [
                {
                    label: 'Count',
                    data: clonesData.map(row => row.count || 0),
                    borderColor: 'rgb(46, 160, 67)',
                    backgroundColor: 'rgba(46, 160, 67, 0.1)',
                    tension: 0.15
                },
                {
                    label: 'Uniques',
                    data: clonesData.map(row => row.uniques || 0),
                    borderColor: 'rgb(137, 87, 229)',
                    backgroundColor: 'rgba(137, 87, 229, 0.1)',
                    tension: 0.15
                }
            ]
        }, {
            responsive: true,
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
            }
        });
    }

    function updateViewsChart(viewsData) {
        if (viewsChart) viewsChart.destroy();
        const totalViews = viewsData.reduce((sum, row) => sum + (row.count || 0), 0);
        const totalUniqueViews = viewsData.reduce((sum, row) => sum + (row.uniques || 0), 0);

        const container = document.getElementById('viewsChart').closest('.chart-container');
        container.querySelector('h2').innerHTML = `GitHub Views (Total: ${totalViews}, Unique: ${totalUniqueViews})`;

        viewsChart = createChart('viewsChart', 'line', {
            labels: viewsData.map(row => row.date),
            datasets: [
                {
                    label: 'Views',
                    data: viewsData.map(row => row.count || 0),
                    borderColor: 'rgb(9, 105, 218)',
                    backgroundColor: 'rgba(9, 105, 218, 0.1)',
                    tension: 0.15
                },
                {
                    label: 'Unique Views',
                    data: viewsData.map(row => row.uniques || 0),
                    borderColor: 'rgb(207, 34, 46)',
                    backgroundColor: 'rgba(207, 34, 46, 0.1)',
                    tension: 0.15
                }
            ]
        }, {
            responsive: true,
            scales: {
                y: { beginAtZero: true, ticks: { precision: 0 } }
            }
        });
    }

    function updatePathsChart(pathsData) {
        if (pathsChart) pathsChart.destroy();
        const accumulatedPaths = {};

        pathsData.forEach(row => {
            for (let i = 1; i <= 10; i++) {
                if (row[`path_${i}`] && row[`path_${i}_count`]) {
                    let path = row[`path_${i}`];
                    path = path.replace(new RegExp(`^/${OWNER}/${currentDataSource}`), '') || '/';
                    const count = parseInt(row[`path_${i}_count`]);
                    accumulatedPaths[path] = (accumulatedPaths[path] || 0) + count;
                }
            }
        });

        const sortedPaths = Object.entries(accumulatedPaths).sort((a, b) => b[1] - a[1]);
        let pathLabels = sortedPaths.map(([p]) => p);
        let pathCounts = sortedPaths.map(([_, c]) => c);

        pathsChart = createChart('pathsChart', 'pie', {
            labels: pathLabels.length ? pathLabels : ['None recorded'],
            datasets: [{
                label: 'Path Views',
                data: pathCounts.length ? pathCounts : [1],
                backgroundColor: PIE_CHART_COLORS
            }]
        });
    }

    function updateReferrersChart(referrersData) {
        if (referrersChart) referrersChart.destroy();
        const accumulatedReferrers = {};

        referrersData.forEach(row => {
            for (let i = 1; i <= 10; i++) {
                if (row[`ref_${i}`] && row[`ref_${i}_uniques`]) {
                    const referrer = row[`ref_${i}`];
                    const uniques = parseInt(row[`ref_${i}_uniques`]);
                    accumulatedReferrers[referrer] = (accumulatedReferrers[referrer] || 0) + uniques;
                }
            }
        });

        const sortedReferrers = Object.entries(accumulatedReferrers).sort((a, b) => b[1] - a[1]);
        let referrerLabels = sortedReferrers.map(([r]) => r);
        let referrerCounts = sortedReferrers.map(([_, c]) => c);

        referrersChart = createChart('referrersChart', 'pie', {
            labels: referrerLabels.length ? referrerLabels : ['None recorded'],
            datasets: [{
                label: 'Unique Referrers',
                data: referrerCounts.length ? referrerCounts : [1],
                backgroundColor: PIE_CHART_COLORS
            }]
        });
    }

    function showDashboard(repo) {
        previewScrollPosition = window.scrollY;
        document.getElementById('previewView').style.display = 'none';
        document.getElementById('dashboardView').style.display = 'block';
        document.getElementById('mainHeader').style.display = 'none';
        currentDataSource = repo;
        const repoLink = document.getElementById('repoLink');
        repoLink.textContent = repo;
        repoLink.href = `https://github.com/${OWNER}/${repo}`;
        loadDataAndCreateCharts();
        history.pushState({view: 'dashboard', repo: repo}, '', `#${repo}`);
        window.scrollTo(0, 0);
    }

    function showPreview() {
        document.getElementById('previewView').style.display = 'block';
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('mainHeader').style.display = 'block';
        history.pushState({view: 'preview'}, '', '#preview');
        window.scrollTo(0, previewScrollPosition);
    }

    window.addEventListener('popstate', (event) => {
        if (event.state && event.state.view === 'dashboard') {
            showDashboard(event.state.repo);
        } else {
            showPreview();
        }
    });

    function initPreviewGrid() {
        const grid = document.getElementById('previewGrid');
        grid.innerHTML = '';
        REPOSITORIES.forEach(repo => {
            const item = document.createElement('div');
            item.className = 'preview-item';
            item.onclick = () => showDashboard(repo);
            item.innerHTML = `
                <img src="preview_plots/${repo}.webp" alt="${repo} traffic preview" onerror="this.src='https://via.placeholder.com/700x350/ffffff/0969da?text=${repo}+Traffic+%26+Clones'"/>
                <div class="click-hint">Click to inspect views, clones, paths & referrers →</div>
            `;
            grid.appendChild(item);
        });
    }

    // Initialize
    initPreviewGrid();
    if (window.location.hash && window.location.hash !== '#preview') {
        const repo = window.location.hash.substring(1);
        if (REPOSITORIES.includes(repo)) showDashboard(repo);
        else showPreview();
    } else {
        showPreview();
    }
    </script>
</body>
</html>
